# spell-checker:ignore rustsec

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
version = 2
# The list is exactly what the dependency graph uses today, so adding a crate
# under a new licence is a decision someone has to make and record here rather
# than something that slips through a permissive allow list. Checked with
# `cargo deny --all-features list`.
allow = [
    # Nearly every crate in the graph, this project included.
    "MIT",
    "Apache-2.0",
    # subtle, for the constant-time hash comparison in shadow-core::crypt.
    "BSD-3-Clause",
    # tinystr and unicode-ident, via uucore's fluent stack.
    "Unicode-3.0",
]
# Deliberately absent:
#   MPL-2.0 -- file-level copyleft, and this project ships MIT only.
#   GPL/LGPL of any version -- see the clean-room policy in CONTRIBUTING.md.
# Two crates carry a copyleft option in a dual licence and are accepted under
# the other half: self_cell is "GPL-2.0-only OR Apache-2.0" and memchr is
# "Unlicense OR MIT". Neither obliges this project to anything.
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Known duplicate dependencies from transitive deps.
skip = [
    # Two independent transitive chains pull incompatible majors and neither is
    # ours to move: syn 3 via uucore -> fluent -> unic-langid -> tinystr ->
    # displaydoc, syn 2 via landlock -> enumflags2 -> enumflags2_derive.
    { name = "syn", version = "2", reason = "landlock's enumflags2_derive still uses syn 2 while uucore's displaydoc uses syn 3" },
]

[sources]
# A crate from anywhere but crates.io is a supply-chain decision, not a
# warning to scroll past.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
