[package]
name = "uu_sg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "sg ~ (shadow-rs) run a command with a different primary group"

[lib]
path = "src/sg.rs"

[[bin]]
name = "sg"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
shadow-core = { workspace = true, features = ["crypt"] }
uucore = { workspace = true }

[lints]
workspace = true

# Distributed via the `shadow-rs` multicall binary in the workspace root
# package, not as a standalone archive (see dist-workspace.toml, issue #207).
[package.metadata.dist]
dist = false
