[package]
name = "uu_chgpasswd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "chgpasswd ~ (shadow-rs) update group passwords in batch"

[lib]
path = "src/chgpasswd.rs"

[[bin]]
name = "chgpasswd"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
shadow-core = { workspace = true, features = ["crypt"] }
uucore = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Distributed via the `shadow-rs` multicall binary in the workspace root
# package, not as a standalone archive (see dist-workspace.toml, issue #207).
[package.metadata.dist]
dist = false
