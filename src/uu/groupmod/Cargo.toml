[package]
name = "uu_groupmod"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "groupmod ~ (shadow-rs) modify a group"

[lib]
path = "src/groupmod.rs"

[[bin]]
name = "groupmod"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
rustix = { workspace = true }
shadow-core = { workspace = true, features = ["shadow", "group", "gshadow", "login-defs"] }
uucore = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Distributed via the `shadow-rs` multicall binary in the workspace root
# package, not as a standalone archive (see dist-workspace.toml, issue #207).
[package.metadata.dist]
dist = false
