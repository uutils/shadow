[package]
name = "uu_chsh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "chsh ~ (shadow-rs) change user login shell"

[lib]
path = "src/chsh.rs"

[[bin]]
name = "chsh"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
rustix = { workspace = true }
shadow-core = { workspace = true }
uucore = { workspace = true }

[features]
default = []
pam = ["shadow-core/pam"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Distributed via the `shadow-rs` multicall binary in the workspace root
# package, not as a standalone archive (see dist-workspace.toml, issue #207).
[package.metadata.dist]
dist = false
