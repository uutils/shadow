[package]
# Published as uu_shadow_core: the name shadow-core on crates.io belongs to an
# unrelated project. The library keeps its Rust name, shadow_core, so nothing
# that uses it changes.
name = "uu_shadow_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "uutils shadow ~ shared library: record parsers, atomic file operations, locking, PAM"

[lib]
name = "shadow_core"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []

# Only the features that change what is linked are features. The record
# parsers pull in no dependencies, so gating them bought nothing and cost
# real confusion: `cargo test -p shadow-core` compiled a fraction of the
# crate and reported a pass for it.
crypt = ["dep:subtle"]
pam = []
landlock = ["dep:landlock"]

[lints]
workspace = true
