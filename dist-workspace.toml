[workspace]
members = ["cargo:."]

# Release automation for the multicall binary (issue #207).
#
# Only the workspace root package (uu_shadow) is distributed: it builds the
# single `shadow-rs` multicall binary that provides all 14 tools via argv[0],
# the same layout as `make install-multicall`. The 14 per-tool crates each
# carry `dist = false` so we ship one archive per target instead of fifteen.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Archives only. The shell installer drops binaries in ~/.local/bin, which is
# misleading for setuid-root account tools — they need root ownership and the
# setuid bit to do anything useful (see the install notes in the README).
installers = []
unix-archive = ".tar.gz"
# Build with PAM. Without it `passwd` refuses the interactive change path
# ("PAM support is not compiled in"), which is the tool's primary function.
features = ["pam"]

# Ship only the multicall binary. `shadow-rs-completions` is a build-time
# helper behind `required-features = ["completions"]`, so it is not part of a
# default build and must not be listed as a release artifact.
[dist.binaries]
"*" = ["shadow-rs"]

# arm64 is built on a native arm64 runner rather than cross-compiled, which is
# what makes it possible at all here: `shadow-core::crypt` links crypt(3) and
# the `pam` feature links libpam, so a cross build would need an arm64 sysroot
# carrying both. dist picks a native runner for aarch64 by itself, but its
# default and the x86_64 default are both Ubuntu 22.04, whose deprecation
# starts on 2026-09-17. Pinning 24.04 keeps the two archives on the same
# runner generation and off a deprecated image.
#
# The higher runner does raise the glibc floor for the dynamically linked
# archives. That is what the static musl archive below is for; the gap is
# documented in docs/PLATFORM-SUPPORT.md.
# The runner is 24.04 because 22.04 begins deprecation on 2026-09-17, but the
# *build* happens inside a 22.04 container. Rust's std links pidfd_spawnp and
# pidfd_getpid when the build host's glibc has them, which on 24.04 raised the
# archives' floor to GLIBC_2.39: 0.3.0 will not start on Debian 12, Ubuntu
# 22.04 or RHEL 9, all of which ran 0.2.2. Building in the container puts the
# floor back at 2.34, which is what 0.2.2 required -- verified by dumping the
# versioned symbols of both binaries.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"
container = { image = "buildpack-deps:22.04", package-manager = "apt" }

# `host` has to say arm64 here. Left at the default, dist takes the container
# for an x86-64 one, concludes it is cross-compiling and adds a cargo-zigbuild
# install that shells out to dnf -- which an apt image has not got.
[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "buildpack-deps:22.04", host = "aarch64-unknown-linux-musl", package-manager = "apt" }

# The global job only assembles artifacts and runs `make dist-musl`, whose
# output is static and carries no glibc floor at all.
[dist.github-custom-runners.global]
runner = "ubuntu-24.04"

# `shadow-core::crypt` links crypt(3), which on Debian/Ubuntu lives in
# libxcrypt rather than glibc; the `pam` feature above links libpam. Both are
# installed on every build runner, so the arm64 job gets the arm64 packages.
[dist.dependencies.apt]
libcrypt-dev = "*"
libpam0g-dev = "*"

# Static musl archive (issue #224). It cannot be a regular target: `features`
# is not per-target in dist, and `pam` must be off for musl (Linux-PAM needs
# dlopen, which a static binary has not got). So it is built as an extra
# artifact by `make dist-musl`, which runs in the global-artifacts job on a
# plain Ubuntu runner — no apt dependencies needed, the musl sysroot is
# self-contained. The "-static" suffix labels it as the reduced build it is;
# docs/PLATFORM-SUPPORT.md, shipped inside the archive, states the gaps.
[[dist.extra-artifacts]]
artifacts = [
    "target/dist-musl/uu_shadow-x86_64-unknown-linux-musl-static.tar.gz",
    "target/dist-musl/uu_shadow-x86_64-unknown-linux-musl-static.tar.gz.sha256",
]
build = ["make", "dist-musl"]
