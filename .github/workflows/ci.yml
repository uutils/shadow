name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ride out transient crates.io/registry blips instead of failing the job.
  CARGO_NET_RETRY: "10"

jobs:
  no-ai-traces:
    name: No AI traces
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need the base branch to diff against.
          fetch-depth: 0
      - name: Check commits, PR text and added lines
        env:
          # Passed through the environment; never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          .github/scripts/no-ai-traces.sh FETCH_HEAD

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # pre-installed tools: https://github.com/actions/runner-images/blob/main/images/ubuntu/
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libselinux1-dev libaudit-dev libcrypt-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Release binaries are built with `pam` (see dist-workspace.toml), so the
      # PAM code path has to be linted too — it is invisible to the run above.
      - run: cargo clippy --workspace --all-targets --features pam -- -D warnings
      # Every optional module compiled at once. `completions` and the
      # shadow-core feature gates are otherwise built by nobody, so a lint or a
      # compile error in them reaches main unnoticed.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libselinux1-dev libaudit-dev libcrypt-dev
      - run: cargo test --workspace
      # Release binaries enable `pam`, and the feature changes behaviour rather
      # than only adding code: without it the setuid tools refuse to
      # authenticate. Both configurations have to be tested.
      - run: cargo test --workspace --features pam

  musl-static:
    name: Static musl archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The exact command the release pipeline runs (extra-artifacts in
      # dist-workspace.toml), so a tag is never the first place a musl
      # regression shows up. No apt packages: the musl sysroot is self-contained.
      - run: make dist-musl
      - name: Smoke-test the archive
        run: |
          set -eu
          name=uu_shadow-x86_64-unknown-linux-musl-static
          (cd target/dist-musl && sha256sum -c "$name.tar.gz.sha256")
          tar xzf "target/dist-musl/$name.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/$name/shadow-rs"
          "$bin" --version
          "$bin" --list | grep -qE '^ *passwd$'
          test -f "$RUNNER_TEMP/$name/PLATFORM-SUPPORT.md"
      # shadow-core's crypt(3) wrapper has musl-specific expectations (no
      # yescrypt, `rounds=` honoured). Run its unit tests against the static
      # musl libc, not only Alpine's dynamic one in the Docker matrix.
      - run: cargo test --target x86_64-unknown-linux-musl -p shadow-core --features crypt
      # `pam` must be refused on static musl, not silently produce a binary
      # whose authentication path can never work.
      - name: pam is rejected on static musl
        run: |
          if cargo check --target x86_64-unknown-linux-musl -p shadow-core --features pam 2>check.log; then
            echo "::error::the pam feature built on static musl; the compile_error guard in shadow-core is gone"
            exit 1
          fi
          grep -q "statically linked musl build" check.log

  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev
      # The fuzz crate is a separate workspace that nothing else builds, so it
      # rots silently: its manifest asked for shadow-core features that no
      # longer exist and nobody noticed. A stable `cargo check` catches that
      # without needing nightly or a fuzzing run.
      #
      # The properties the targets assert are also replayed against the tracked
      # corpus by the main test suite, so a regression a fuzzer once found is
      # caught on every pull request.
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  msrv:
    name: MSRV (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libselinux1-dev libaudit-dev libcrypt-dev
      - run: cargo check --workspace --all-targets

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  e2e:
    name: End-to-end (install, setuid, PAM, Landlock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A real deployment: release build with pam, `make install-multicall`
      # over GNU's binaries, then the deployment test suite as root and as an
      # unprivileged user. This is the only place PAM password changes, the
      # setuid privilege model and the Landlock rules are exercised for real.
      - name: Build e2e image
        run: |
          for attempt in 1 2 3; do
            docker compose build e2e && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::e2e image build attempt $attempt failed (likely a registry timeout); retrying in 30s"
              sleep 30
            fi
          done
          exit 1
      - name: Run deployment tests
        run: docker compose run --rm e2e

  test-docker:
    name: Test (${{ matrix.target }})
    # Runs on pull requests as well: roughly three quarters of the integration
    # suite is root-only and skips silently off-root, so a host-only run proves
    # little. Each distro takes a couple of minutes.
    runs-on: ubuntu-latest
    strategy:
      # One distro's transient registry timeout must not cancel the others.
      fail-fast: false
      matrix:
        target: [debian, alpine, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Base images are pulled from Docker Hub at build time; retry to ride
      # out transient registry timeouts that would otherwise fail the job.
      - name: Build ${{ matrix.target }} image
        run: |
          for attempt in 1 2 3; do
            docker compose build ${{ matrix.target }} && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::'${{ matrix.target }}' image build attempt $attempt failed (likely a registry timeout); retrying in 30s"
              sleep 30
            fi
          done
          exit 1
      # Forward the workflow-wide CARGO_NET_RETRY into the container (single
      # source of truth) so cargo retries crate downloads; a real test failure
      # still fails fast (no step-level retry).
      # Both feature configurations, as root. `pam` changes which code paths
      # exist -- chfn and chsh refuse every non-root call without it, and
      # passwd loses its interactive path -- so root and PAM together were
      # never exercised by any job.
      #
      # SHADOW_TEST_REQUIRE_ROOT comes from docker-compose.yml: these
      # containers run as root, so a root-only test that skips here is a
      # failure rather than a silent pass.
      - name: Test on ${{ matrix.target }}
        run: docker compose run --rm -e CARGO_NET_RETRY ${{ matrix.target }} cargo test --workspace
      # Not on Alpine: its Rust image targets musl with crt-static, where
      # shadow-core refuses `pam` at compile time on purpose -- Linux-PAM
      # dlopen()s its modules and a static binary cannot. The static musl job
      # asserts that refusal; Alpine is here for musl's libc behaviour.
      - name: Test on ${{ matrix.target }} with pam
        if: matrix.target != 'alpine'
        run: docker compose run --rm -e CARGO_NET_RETRY ${{ matrix.target }} cargo test --workspace --features pam
